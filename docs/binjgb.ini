# Keyboard configuration shared by index.html and simple.html.
# Reload the page after editing. Physical key names match the native INI.
ps2-keyboard=1
ps2-keys=all

# Defaults preserve each page's existing joypad and shortcut bindings.
# For a typing profile, uncomment the following block. Physical controllers
# and the simple page's touch controls remain available.
# joypad=none
# shortcuts=none
# shortcut-pause=F5
# shortcut-save-state=F6
# shortcut-rewind=F8
# shortcut-load-state=F9
# shortcut-fullscreen=F11

# Leave Ctrl/Alt/Meta combinations to the browser by default. Set to 1 to
# forward supported combinations to the emulator instead.
capture-browser-shortcuts=0
